<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Template</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="content">
      <h1>Um Gráfico de Barras</h1>
      <form action="" name="barras">
        <p class="Alturas">Informe a altura das barras:</p>
        <input type="text" name="alt1" />
        <input type="text" name="alt2" />
        <input type="text" name="alt3" />
        <input type="text" name="alt4" />
        <input type="text" name="alt5" />
        <br />
        <p class="Larguras">Informe a largura das barras:</p>
        <input type="text" name="largura" />
        <br />
        <input type="submit" name="desenha" value="Desenhar o grafico" />
      </form>
    </div>
    <script src="script.js"></script>
  </body>
</html>
