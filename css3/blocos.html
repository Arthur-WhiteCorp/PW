<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Nebuloso</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <style>
      div.blue {
        width: 100px;
        height: 200px;
        background-color: blue;
      }
      div.yellow {
        position: relative;
        width: 100px;
        height: 150px;
        top: -200px;
        left: 100px;
        background-color: yellow;
      }
      div.red {
        position: relative;
        top: -350px;
        left: 200px;
        width: 100px;
        height: 150px;
        background-color: red;
      }
      div.green {
        position: relative;
        top: -350px;
        left: 100px;
        width: 200px;
        height: 50px;
        background-color: green;
      }
    </style>
    <div class="blue"></div>
    <div class="yellow"></div>
    <div class="red"></div>
    <div class="green"></div>
  </body>
</html>
